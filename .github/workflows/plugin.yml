name: Build plugin

on:
  push:
    paths:
      - "plugin/**"
      - "src/**"
      - "dist/**"
      - ".github/workflows/plugin.yml"
  pull_request:
    paths:
      - "plugin/**"
      - "src/**"
      - "dist/**"
      - ".github/workflows/plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libglu1-mesa-dev mesa-common-dev

      - name: Install the WebView2 SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/webview2".Replace('\', '/')
          nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory $dir
          "WEBVIEW2_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: bash
        run: |
          args=(-S plugin -B build -DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = "macOS" ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          if [ "$RUNNER_OS" = "Windows" ]; then args+=("-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$WEBVIEW2_DIR"); fi
          if [ "$RUNNER_OS" = "Linux" ]; then args+=(-DMDS_BUILD_TESTS=ON); fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run processor tests
        if: runner.os == 'Linux'
        run: |
          ./build/StudioTests_artefacts/Release/StudioTests plugin/Tests/state.json

      - name: Check the Windows plugin needs no extra runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse "build/MelodyDrumStudio_artefacts/Release/VST3" -Filter *.vst3 -File | Select-Object -First 1
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vs\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents $dll.FullName
          $deps
          if ($deps -match 'MSVCP140|VCRUNTIME140') { throw "The plugin still depends on the Visual C++ runtime DLLs" }

      - name: Collect plugins
        shell: bash
        run: |
          src=build/MelodyDrumStudio_artefacts/Release
          mkdir -p out
          cp -R "$src/VST3/"*.vst3 out/
          if [ -d "$src/AU" ]; then cp -R "$src/AU/"*.component out/; fi
          if [ -d "$src/Standalone" ]; then cp -R "$src/Standalone/"* out/; fi
          cp plugin/INSTALL.md out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Sonata-${{ matrix.name }}
          path: out
          if-no-files-found: error
